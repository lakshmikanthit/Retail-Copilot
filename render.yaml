services:
  - type: web
    name: retail-copilot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn retail_copilot.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: retail-copilot-db
          property: connectionString
databases:
  - name: retail-copilot-db
    databaseName: retail_copilot
    user: retail_copilot_user
